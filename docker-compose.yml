# Chess Yetu: Postgres + API (with Stockfish) + web.
# Host ports are deliberately unusual (5433 / 8780 / 8081) so they don't clash with other local stacks.
#   docker compose up --build        then open http://localhost:8081
#   psql:  postgresql://chess:${POSTGRES_PASSWORD:-chess_dev_password}@localhost:5433/chess_yetu
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chess_dev_password}
      POSTGRES_DB: chess_yetu
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess_yetu"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://chess:${POSTGRES_PASSWORD:-chess_dev_password}@db:5432/chess_yetu
      # Set a long random value in .env for anything beyond local use.
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me-0123456789}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
    ports: ["8780:8000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: ./web
      args: { VITE_API_PORT: "8780" }
    ports: ["8081:3000"]
    depends_on: [api]

volumes:
  pgdata:
